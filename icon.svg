<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="18" fill="#335061"/>
  <!-- Jenkins butler hat -->
  <ellipse cx="50" cy="68" rx="28" ry="6" fill="#f0a500"/>
  <rect x="32" y="42" width="36" height="28" rx="4" fill="#f0a500"/>
  <!-- face -->
  <ellipse cx="50" cy="38" rx="20" ry="22" fill="#f5c97a"/>
  <!-- eyes -->
  <circle cx="43" cy="34" r="3" fill="#335061"/>
  <circle cx="57" cy="34" r="3" fill="#335061"/>
  <!-- smile -->
  <path d="M 42 44 Q 50 50 58 44" stroke="#335061" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- hat top -->
  <rect x="38" y="18" width="24" height="26" rx="3" fill="#1a1a2e"/>
  <rect x="34" y="42" width="32" height="5" rx="2" fill="#1a1a2e"/>
  <!-- MCP label -->
  <text x="50" y="88" font-family="monospace" font-size="10" font-weight="bold" fill="#f0a500" text-anchor="middle">MCP</text>
</svg>
